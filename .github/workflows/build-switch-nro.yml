
name: Build USF4-NX Switch NRO (no intro)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check build prerequisites
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f app/generated/rexglue.cmake ]; then
            echo "::error::Missing app/generated/rexglue.cmake."
            echo "The game's generated C++ code is not included in the source ZIP."
            echo "Generate it from your own game executable before building."
            exit 1
          fi

          if [ ! -f tools/switch/cmake/switch-devkitA64.cmake ]; then
            echo "::error::Switch toolchain file is missing."
            exit 1
          fi

          if [ ! -f build-inputs/horizon-sdk/opt/devkitpro/portlibs/switch/lib/libvulkan.a ]; then
            echo "::error::Missing custom Horizon SDK."
            echo "Provide the correctly prepared SDK at build-inputs/horizon-sdk."
            exit 1
          fi

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 git docker.io

      - name: Fetch SDK third-party sources
        run: python3 tools/fetch_thirdparty.py

      - name: Build glslangValidator
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e DEVKITPRO=/opt/devkitpro \
            devkitpro/devkita64 \
            bash -lc '
              cmake -S sdk/thirdparty/glslang \
                -B out/glslang-dkp -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_OPT=OFF \
                -DGLSLANG_TESTS=OFF \
                -DENABLE_HLSL=OFF
              ninja -C out/glslang-dkp glslangValidator
            '

      - name: Configure Switch build
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e DEVKITPRO=/opt/devkitpro \
            devkitpro/devkita64 \
            bash -lc '
              cmake -S app -B out/nx -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$PWD/tools/switch/cmake/switch-devkitA64.cmake" \
                -DREXGLUE_SWITCH_NVK_SDK="$PWD/build-inputs/horizon-sdk/opt/devkitpro/portlibs/switch" \
                -DSA2_GLSLANG_VALIDATOR="$PWD/out/glslang-dkp/StandAlone/glslangValidator" \
                -DDEVKITPRO=/opt/devkitpro
            '

      - name: Compile NRO
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e DEVKITPRO=/opt/devkitpro \
            devkitpro/devkita64 \
            bash -lc '
              cmake --build out/nx -j 4
            '

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          test -s out/nx/usf4.nro
          file out/nx/usf4.nro || true
          ls -lh out/nx/usf4.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: usf4-nx-no-intro-nro
          path: out/nx/usf4.nro
          if-no-files-found: error
          retention-days: 7
