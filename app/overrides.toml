# Ultra Street Fighter IV-specific analysis corrections for the code generator.
#
# Every entry needs its evidence (which tool or which log found it). The tools that produce candidates:
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_scan.py, pointer_fixpoint.py  code pointers stored in data (vtables, callback tables)
#   tools/switch_check.py                       truncated jump tables
#   tools/runtime_gap_resolver.py               "Call to invalid or unregistered function" from a game log

# The CRT's setjmp/longjmp (root keys: they must stay outside any table). Lua 5.1.1 is linked in ("$Lua: Lua 5.1.1
# Copyright ...") and reports errors with longjmp back to the setjmp of its protected call; recompiled as plain calls,
# longjmp would return into a foreign stack frame. Found by shape in the decrypted image (2026-10-11), neither has a
# .pdata entry:
#   setjmp  0x8251C1E0: optional override pointer at 0x82C62A24 (bnectr), then mflr/mfcr, stfd f14-f31 at 0..136(r3),
#           std r13-r31 at 152..296(r3), stvx128 of the vector registers, stw cr/lr at 304/308(r3),
#           std r1 at 144(r3), stw 0 at 312(r3), li r3,0; blr
#   longjmp 0x82517AF0: the mirror image through r7 = r3 (lfd f14-f31 at 0..136, ld r13-r31 at 152..296, lvx128),
#           mtlr from 308(r7), ld r1 from 144(r7), mtcrf from 304(r7), mr r3,r6 (the value); blr. When 312(r7) != 0
#           it takes the unwinding path instead (0x82517DDC).
setjmp_address = 0x8251C1E0
longjmp_address = 0x82517AF0

[functions]
# First codegen run (rexglue codegen, 2026-10-11): a direct unconditional branch (`b`, a tail call) to each address
# below, which automatic discovery had not assigned to any function ("target not in any function"; the caller is
# listed). None has a .pdata entry; each follows an unconditional terminator and begins with code that reads only
# argument registers. No sizes imposed: the Discover phase determines each boundary.
"0x82950EF0" = { }  # from 0x82950FF4; after a bctr; lwz r11,96(r4) ...
"0x822C1758" = { }  # from 0x822B198C; after a b; lwz r11,300(r3) / addi r3,r3,300 / virtual tail call (bctr)
"0x82292560" = { }  # from 0x822A97DC; after a b; lwz r3,608(r3) / b 0x822AE890 (member-forwarding thunk)
"0x823E53E0" = { }  # from 0x823E031C; after a b; lwz r11,20(r3) / li r6,0 / addic. ... (loop over r3's array)
"0x82950E80" = { }  # from 0x82950FB4 (exposed once pointer_fixpoint pass 1 declared 0x82950FA0); after a bctr;
# same body as 0x82950EF0: lwz r11,96(r4) / loop over two 664-byte entries / virtual tail call (bctr)
# A vtable entry the pointer fixpoint rejected ("extends beyond its gap"): tools/pointer_audit.py, vtable-like,
# pointer at 0x8212A5A8 between other function starts (0x82950FA0, 0x82950B30, ...). After a bctr; lwz r11,0(r4),
# compares with 1 and 3, ends in a virtual tail call at 0x82950F9C. Its gap is split by sub_82950F7C, the one-word
# `b 0x82950E08` inside it that discovery registered on its own, hence the explicit size.
"0x82950F60" = { size = 0x40 }

# Callbacks whose address is built in code (lis/addi), not stored in data. First boot (2026-10-11): "[FATAL] Call to
# invalid or unregistered function at guest address 0x8265BC98". tools/pointer_audit.py had listed it ("built in
# code", in a gap) and tools/pointer_fixpoint.py rejected it as a fragment. It is a sort comparator: 0x82674FAC-B4
# builds it into r6 for `bl 0x8251AD50` (r3 base, r4 count, r5 = 4, the element size: a qsort); it reads only r3/r4
# (lwz r11,0(r3) / lwz r9,0(r4)) and compares the two elements' lists.
"0x8265BC98" = { }

