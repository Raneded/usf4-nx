# Ultra Street Fighter IV, Switch build: fixed settings compiled into the NRO (src/usf4_app.h BuiltInConfig), applied
# before the player's usf4.toml next to the NRO, which may still override any of them key by key.

# The native Vulkan renderer (NVK); the emulated GPU is far too slow on the console.
sa2_renderer_native = true
sa2_render_height_handheld = 720
sa2_render_height_docked = 1080
sa2_shader_misses = ""

# First console builds: keep a log on the SD card (sdmc:/switch/usf4-nx/logs) to diagnose boots. sa2-nx's release
# turns it off ("off", false) once the port is stable.
log_level = "info"
log_to_file = true

# Game frame rate in the log every 5 s (src/usf4_frame_counter.cpp).
usf4_fps_log = true

# The renderer's enhancements (sa2-nx docs/enhancements.md), as on PC: every key is on unless listed here.
sa2_cpu_enhancements = true
sa2_noncpu_enhancements = true

# Game files: read the game_root folder next to the NRO directly. The SDK's asset pack (one .nxpack built from the
# folder on the first boot) would be a second 7.7 GB copy on the card, more than FAT32's 4 GB per file, and USF4's
# data is already a few large archives (battle.eaf 2.8 GB, ...), so it would save few file opens. A pack made on the
# PC (tools/build_asset_pack.py) is still used if present, on an exFAT card.
asset_pack_build = false

# Profiling build (0.2.0): GPU time per pass category in the log (EDRAM transfers, scene, copies, ...), and CPU stack
# samples of the game threads in logs/rex/rex_profile.log. Both cost a little; off since 0.6.8 (one GPU mark per
# submission and the 10-second report with per-thread CPU stay). Set both true for a profiling build.
sa2_gpu_marks_categories = false
switch_profile_stacks = false

# 0.3.0: Direct3D's Clear through the 4x alias clears straight into the depth views that own its tiles
# (docs/usf4-notes.md, "Clears into depth owners"): -81 % of the 9-pass depth imports in a fight.
usf4_edram4_clear_into_depth = true

# 0.4.0: the color half of that clear goes straight into the view that reads its tiles next (learned per clear), not
# into the depth owners: on PC depth exports -45 %, color aliases -12 %, depth imports +13 %, same image
# (docs/usf4-notes.md, "Color-0 clears into their consumer"). To A/B on the console: false in usf4.toml.
usf4_edram4_clear_color_consumer = true

# 0.5.0: one 1280x720 tile without MSAA instead of predicated tiling (three strips at 2x MSAA): about half the draws,
# no colour aliases (docs/usf4-notes.md, "One tile instead of three"). Edges are a little harder (the game's 2x MSAA
# is gone). false in usf4.toml for the three strips. 0.5.1: the renderer's EDRAM model has 4096 tiles, so the one-tile
# scene's depth no longer wraps onto colour 0 (it made the ring thread walk ~30 M EDRAM tiles a second on the Switch).
usf4_single_tile = true

# 0.5.3: the end of the frame does not wait for the Vulkan recording worker: the work submission and the output paint
# run on the worker in queue order, and the ring thread starts the next frame (on 0.5.2 it waited ~5 ms per frame,
# 26 % of its time, at vkEndCommandBuffer). PC: 0 drains in a fight, same frames (docs/usf4-notes.md). false in
# usf4.toml for the previous behaviour.
usf4_deferred_async_submit = true

# 0.5.4: a deferred recording queue of 4096 calls (512 KB) instead of 1024. On 0.5.3 the ring thread was "working"
# 21.6 ms per 21.7 ms frame but on the CPU only 68 % of it: the rest it waited for room in the queue (~1/5 of a frame).
# The log line "deferred recording drains by cause" says how often the queue is still full. 10 = the previous length.
usf4_deferred_slots_log2 = 12

# 0.7.2: the recording worker blocks on its condition variable as soon as the queue is empty (no 5 us naps first; the
# ring thread wakes it at every publish). Console 0.7.1 (2026-10-17): 64 naps = ~50k wake-ups per second at the ring
# thread's priority on core 0; 0 = 1-7k, worker 37 -> 33 % of a core, Status Monitor core 1 79-89 -> 56-66 %, 60 fps,
# ring +0.4 ms per Swap (the wake at each publish). 64 = the previous behaviour.
sa2_native_deferred_recording_naps = 0
